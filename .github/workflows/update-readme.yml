name: Update README with Latest Releases

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Update releases table
        run: |
          python3 << 'PYEOF'
          import requests
          from datetime import datetime
          
          # Get releases
          resp = requests.get('https://api.github.com/repos/cxinmayy/pebble/releases')
          releases = resp.json()
          
          print(f"Found {len(releases)} releases")
          
          # Read README
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          print("README loaded successfully")
          
          # Find table markers
          start_marker = '<table align="center" width="100%">'
          end_marker = '</table>'
          
          start_idx = content.find(start_marker)
          end_idx = content.find(end_marker, start_idx)
          
          if start_idx == -1 or end_idx == -1:
              print("ERROR: Table not found in README")
              exit(1)
          
          print(f"Table found at positions {start_idx} to {end_idx}")
          
          # Keep table header
          header_end = content.find('</tr>', start_idx) + len('</tr>')
          header_end = content.find('</tr>', header_end) + len('</tr>')
          
          # Build new rows
          rows = []
          for rel in releases:
              tag = rel['tag_name']
              date = datetime.strptime(rel['published_at'], '%Y-%m-%dT%H:%M:%SZ').strftime('%B %d, %Y')
              body = rel['body'].split('\n')[0][:80] if rel['body'] else 'Release'
              
              colors = {
                  'v2.7.1': 'FF6B6B', 'v2.7': '00D4FF', 'v2.6': '4CAF50', 'v2.5': 'FFD700',
                  'v2.4.2': '9C27B0', 'v2.4.1': 'FF9800', 'v2.3': '3498DB', 'v2.2.1': 'E74C3C',
                  'v2.2': '1ABC9C', 'v2.1': '34495E', 'v2.0': '2ECC71', 'v1.0': '27AE60'
              }
              color = colors.get(tag, 'CCCCCC')
              
              row = f'\n  <tr bgcolor="#F5F5F5">\n    <td align="center"><img src="https://img.shields.io/badge/{tag}-{color}?style=flat" /></td>\n    <td>{body}</td>\n    <td align="center">{date}</td>\n    <td align="center"><a href="https://github.com/cxinmayy/pebble/releases/tag/{tag}">📖</a></td>\n  </tr>'
              rows.append(row)
          
          # Reconstruct content
          before = content[:header_end]
          after = content[end_idx:]
          new_content = before + ''.join(rows) + '\n' + after
          
          # Write back
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(new_content)
          
          print("✅ README updated successfully!")
          PYEOF
      
      - name: Commit and push
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update release table" && git push)
