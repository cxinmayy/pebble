name: Update README with Latest Releases

on:
  release:
    types: [published, edited]
  workflow_dispatch:

jobs:
  update_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Update README
        run: |
          python3 << 'PYTHON_EOF'
          import requests
          from datetime import datetime
          
          response = requests.get('https://api.github.com/repos/cxinmayy/pebble/releases')
          releases = response.json()
          
          colors = {
              'v2.7.1': 'FF6B6B', 'v2.7': '00D4FF', 'v2.6': '4CAF50', 'v2.5': 'FFD700',
              'v2.4.2': '9C27B0', 'v2.4.1': 'FF9800', 'v2.3': '3498DB', 'v2.2.1': 'E74C3C',
              'v2.2': '1ABC9C', 'v2.1': '34495E', 'v2.0': '2ECC71', 'v1.0': '27AE60'
          }
          
          with open('README.md', 'r') as f:
              content = f.read()
          
          table_start = content.find('<table align="center" width="100%">')
          table_end = content.find('</table>', table_start) + len('</table>')
          header = content[:table_start + len('<table align="center" width="100%">\n  <tr>\n    <td colspan="4" align="center" bgcolor="#FF6B6B" style="padding: 10px; color: white; font-weight: bold;">VERSION TIMELINE</td>\n  </tr>\n  <tr>\n    <td align="center" width="25%"><strong>Version</strong></td>\n    <td align="center" width="45%"><strong>Key Features</strong></td>\n    <td align="center" width="20%"><strong>Release Date</strong></td>\n    <td align="center" width="10%"><strong>Link</strong></td>\n  </tr>')]
          
          rows = []
          for release in releases:
              tag = release['tag_name']
              color = colors.get(tag, 'CCCCCC')
              date = datetime.strptime(release['published_at'], '%Y-%m-%dT%H:%M:%SZ').strftime('%B %d, %Y')
              body_text = release['body'].strip().split('\n')[0][:80] if release['body'] else 'Release'
              
              row = f'\n  <tr bgcolor="#F5F5F5">\n    <td align="center"><img src="https://img.shields.io/badge/{tag}-{color}?style=flat" /></td>\n    <td>{body_text}</td>\n    <td align="center">{date}</td>\n    <td align="center"><a href="https://github.com/cxinmayy/pebble/releases/tag/{tag}">📖</a></td>\n  </tr>'
              rows.append(row)
          
          new_table = header + ''.join(rows) + '\n</table>'
          new_content = content[:table_start] + new_table + content[table_end:]
          
          with open('README.md', 'w') as f:
              f.write(new_content)
          
          print("✅ README updated!")
          PYTHON_EOF

      - name: Commit and Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Update README with latest releases" && git push origin main)
